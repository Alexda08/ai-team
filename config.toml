# AI Dev Team Configuration
# All values shown are defaults — only override what you need.

[llm]
provider = "ollama"
host = "http://localhost:11434"
default_model = "minimax-m2.7:cloud"
temperature = 0.7

[llm.model_map]
light = "minimax-m2.7:cloud"
medium = "qwen3.5:cloud"
heavy = "qwen3-coder-next:cloud"
ultra = "qwen3-coder:480b-cloud"

[runtime]
max_turns = 10
max_retries = 2
workspace_path = "./workspace"
output_path = "./output"

[traces]
enabled = true
db_path = "traces/traces.db"

[security]
enabled = false

[claude_code]
enabled = true
max_turns = 10
timeout = 300
allowed_tools = "Edit,Write,Read,Bash"

[learning]
enabled = true
min_quality = 0.7
min_improvement = 0.02
config_dir = "agent_configs"

[evaluation]
enabled = false
parallel = false
